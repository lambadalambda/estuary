[package]
name = "dcvm"
version = "0.1.0"
edition = "2021"
description = "DeltaChat viewmodel: headless client logic over deltachat core, exposed via UniFFI"
license = "Unlicense"

[lib]
crate-type = ["lib", "staticlib"]

[features]
# Enables the bindgen CLI bin; kept out of default so plain `cargo build/test`
# does not need clap/camino.
cli = ["uniffi/cli"]

[dependencies]
# `internals` (an empty/cfg-only feature) is needed because v2.49.0 gates
# `receive_imf` behind it; we use receive_imf for offline tests + demo data.
deltachat = { git = "https://github.com/chatmail/core", tag = "v2.53.0", features = ["internals"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
uniffi = { version = "0.32", features = ["tokio"] }
thiserror = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# STT pipeline: decode voice-message blobs (m4a/aac/mp3/ogg-vorbis/wav) …
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3"] }
# … and resample to the 16 kHz mono PCM transcribe.cpp expects.
rubato = "0.16"
# ASR engine (GGML; Metal by default on Apple). Early crate — pin exact
# (0.2.0 exists in-repo but is unpublished; 0.1.3 is the crates.io latest).
transcribe-cpp = "=0.1.3"
# Model download + integrity; versions match what core already locks.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Durable transcript store (transcripts.json under the data dir).
serde_json = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"
required-features = ["cli"]

[profile.dev]
# core is far too slow at opt-level 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
