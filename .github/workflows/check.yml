name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Must match the Makefile pin — the clippy step bypasses make, and cc
      # outputs built without the pin poison later pinned builds (see
      # nightly.yml and meta/issues/local-core-deployment-target.md).
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        run: |
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select -s /Applications/Xcode_16.4.app
          swift --version

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: dcvm
          # Pin participates in the key: cached cc objects built under a
          # different pin never re-fingerprint (see nightly.yml).
          env-vars: MACOSX_DEPLOYMENT_TARGET

      - name: Test and build
        run: make check

      - name: Verify generated bindings are committed
        run: |
          git diff --exit-code -- macos/Sources/DeltaCore macos/Sources/DeltaCoreFFI
          test -z "$(git ls-files --others --exclude-standard -- \
            macos/Sources/DeltaCore macos/Sources/DeltaCoreFFI)"

      - name: Rust formatting and lints
        run: |
          cd dcvm
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
