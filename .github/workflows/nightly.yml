# Nightly build: every push to main publishes an immutable commit-addressed
# DMG, built release-profile (Rust + Swift), then advances the `nightly`
# release-page pointer. Rust stays on ONE
# profile throughout (cargo test --release) so the cache carries a single
# core build instead of two.
name: nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queue publication so an older running build cannot race a newer build.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Must match the Makefile pin (and Package.swift .v15). Job-level on
      # purpose: the direct cargo/swift steps below bypass make, and cc
      # build-script outputs compiled without the pin (runner SDK default
      # 15.5) are NOT re-fingerprinted by a later pinned build — they'd be
      # reused, and verify-minos rejects the archive. See
      # meta/issues/local-core-deployment-target.md.
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # CFBundleVersion is the reachable commit count, so a shallow clone
          # would stamp every nightly as build 1.
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 16.4
        run: |
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select -s /Applications/Xcode_16.4.app
          swift --version

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: dcvm
          # Rotate the key for the release-profile switch: an exact hit on
          # the old debug-artifact cache would skip saving, cold-building
          # release core on EVERY run instead of once.
          prefix-key: release
          # Deployment-target pin participates in the key: cached cc objects
          # built under a different pin never re-fingerprint (the blake3
          # 15.5 incident, run 29662809033).
          env-vars: MACOSX_DEPLOYMENT_TARGET

      - name: Rust tests
        run: cd dcvm && cargo test --locked --release

      # `make PROFILE=release dmg` covers cargo build --release -> UniFFI bindings ->
      # swift build -c release -> .app assembly (icon, SPM resource bundle,
      # git-SHA stamp, ad-hoc sign) -> DMG packaging.
      - name: Build app bundle and DMG
        run: make PROFILE=release dmg

      # Debug-config test build, but linked against the release rust lib so
      # the dev-profile core is never built on this runner.
      - name: Swift tests
        run: cd macos && DCVM_PROFILE=release swift test --disable-sandbox

      - name: Verify app bundle and DMG
        run: |
          make verify-app
          make verify-dmg

      - name: Publish immutable nightly asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: dev/release/publish-nightly.sh Estuary-nightly.dmg
