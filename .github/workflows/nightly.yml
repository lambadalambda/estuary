# Nightly build: every push to main recreates the `nightly` prerelease with
# a fresh DMG, built release-profile (Rust + Swift). Rust stays on ONE
# profile throughout (cargo test --release) so the cache carries a single
# core build instead of two.
name: nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queue (don't cancel): a cancel between `release delete` and `release
# create` would leave the stable download URL 404ing until the next run.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Newest Xcode on the image: the Liquid Glass path needs the macOS 26
      # SDK; on older SDKs the code compile-guards down to bar material.
      - name: Select newest Xcode
        run: |
          # Prefer stable: sort -V ranks "_beta" ABOVE the same stable
          # version, and a beta may lag the stable next to it.
          XCODE=$(ls -d /Applications/Xcode*.app \
            | grep -viE 'beta|release.candidate' | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dcvm
          # Rotate the key for the release-profile switch: an exact hit on
          # the old debug-artifact cache would skip saving, cold-building
          # release core on EVERY run instead of once.
          prefix-key: release

      - name: Rust tests
        run: cd dcvm && cargo test --release

      # `make app-release` covers cargo build --release -> uniffi bindings ->
      # swift build -c release -> .app assembly (icon, SPM resource bundle,
      # git-SHA stamp, ad-hoc sign).
      - name: Build app bundle
        run: make app-release

      # Debug-config test build, but linked against the release rust lib so
      # the dev-profile core is never built on this runner.
      - name: Swift tests
        run: cd macos && DCVM_PROFILE=release swift test --disable-sandbox

      - name: Package DMG
        run: |
          mkdir dmg-staging
          cp -R macos/Estuary.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname Estuary -srcfolder dmg-staging \
            -ov -format UDZO Estuary-nightly.dmg

      # Delete-and-recreate keeps the asset URL stable:
      # releases/download/nightly/Estuary-nightly.dmg
      - name: Recreate nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly Estuary-nightly.dmg \
            --prerelease \
            --title "Estuary nightly ($(git rev-parse --short HEAD))" \
            --notes "Automated build of \`main\` @ ${GITHUB_SHA}.

          Ad-hoc signed (no Apple developer certificate): on first launch,
          right-click the app → Open, or run
          \`xattr -dr com.apple.quarantine /Applications/Estuary.app\`."
