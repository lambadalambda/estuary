[package]
name = "dcvm"
version = "0.1.0"
edition = "2021"
description = "DeltaChat viewmodel: headless client logic over deltachat core, exposed via UniFFI"
license = "MPL-2.0"

[lib]
crate-type = ["lib", "staticlib"]

[features]
# Enables the bindgen CLI bin; kept out of default so plain `cargo build/test`
# does not need clap/camino.
cli = ["uniffi/cli"]

[dependencies]
# `internals` (an empty/cfg-only feature) is needed because v2.49.0 gates
# `receive_imf` behind it; we use receive_imf for offline tests + demo data.
deltachat = { git = "https://github.com/chatmail/core", tag = "v2.53.0", features = ["internals"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
uniffi = { version = "0.32", features = ["tokio"] }
thiserror = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"
required-features = ["cli"]

[profile.dev]
# core is far too slow at opt-level 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
