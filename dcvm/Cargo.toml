[package]
name = "dcvm"
version = "0.1.0"
edition = "2021"
description = "DeltaChat viewmodel: headless client logic over deltachat core, exposed via UniFFI"
license = "MPL-2.0"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
deltachat = { git = "https://github.com/chatmail/core", tag = "v2.49.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
# core is far too slow at opt-level 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
